version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: auth-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - auth-network

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: auth-sentinel
    ports:
      - "8088:8088"
    networks:
      - auth-network

  mysql:
    image: mysql:8.0
    container_name: auth-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=auth_center
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - auth-network

  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - auth-network

  auth-gateway:
    build:
      context: ./auth-gateway
      dockerfile: Dockerfile
    container_name: auth-gateway
    ports:
      - "8080:8080"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - SENTINEL_DASHBOARD=sentinel:8088
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nacos
      - redis
      - sentinel
    networks:
      - auth-network

  auth-system:
    build:
      context: ./auth-system
      dockerfile: Dockerfile
    container_name: auth-system
    ports:
      - "8081:8081"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - SENTINEL_DASHBOARD=sentinel:8088
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - nacos
      - mysql
      - redis
      - sentinel
    networks:
      - auth-network

volumes:
  mysql-data:
  redis-data:
  nacos-data:

networks:
  auth-network:
    driver: bridge
