version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: supply-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: supply_booking
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - supply-network

  redis:
    image: redis:7-alpine
    container_name: supply-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - supply-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: supply-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - supply-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supply-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root123
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - supply-network
    restart: on-failure

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  supply-network:
    driver: bridge
