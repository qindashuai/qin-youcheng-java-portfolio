toolkit:
  jwt:
    secret: defaultSecretKeyForHmacSha256AlgorithmMustBe256BitsLong
    issuer: qindashuai-toolkit
    access-token-expiration: 7200000
    refresh-token-expiration: 604800000
    token-header: Authorization
    token-prefix: "Bearer "
    algorithm: HMAC
  redis:
    key-prefix: "toolkit:"
    default-expiration: 3600
    lock-wait-timeout: 3000
    lock-lease-time: 30000

spring:
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{50} - %msg%n"
